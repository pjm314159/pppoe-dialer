name: CI

# Windows only, on purpose: this is a Windows service that calls the service
# control manager, RAS and the IP Helper API directly. There is nothing to test
# on Linux or macOS, so the workflow runs exactly one platform.
on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]   # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test / release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # The same script a developer runs locally and the pre-commit hook runs,
      # so the three cannot drift apart. --locked additionally fails the build
      # when Cargo.lock was not updated together with a dependency change.
      - name: Validate
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/check.ps1 -Locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Report the toolchain
        shell: pwsh
        run: |
          cargo --version
          rustc --version --verbose

      - name: Upload the release binary
        uses: actions/upload-artifact@v4
        with:
          name: pppoe-exe-${{ github.sha }}
          path: target/release/pppoe.exe
          if-no-files-found: error
          retention-days: 14
